name: Quality

# Fails the build if the portfolio stops meeting its goals: the GitHub CTA
# above the fold, zero WCAG 2.1 AA violations, and the Lighthouse budgets.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: E2E + axe (1366x768 and 390x844)
        run: npm run test:e2e

      - name: Lighthouse CI (mobile) with budgets
        run: npm run lhci

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reports
          path: |
            playwright-report/
            test-results/
            .lighthouseci/
